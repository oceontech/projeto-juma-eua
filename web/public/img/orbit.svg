<svg width="420" height="360" viewBox="0 0 420 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="topo-stroke" x1="24" y1="32" x2="392" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8E63A" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#A8E63A" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#A8E63A" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="divider" x1="0" y1="24" x2="0" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8E63A" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#A8E63A" stop-opacity="0.28"/>
      <stop offset="0.82" stop-color="#A8E63A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A8E63A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge-fade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="0.08" stop-color="white"/>
      <stop offset="0.9" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <mask id="soft-edges">
      <rect width="398" height="360" fill="url(#edge-fade)"/>
    </mask>

    <style>
      .wave {
        will-change: transform;
        animation: waveFlow 4.6s ease-in-out infinite;
      }

      .wave-1  { animation-delay: -0.00s; }
      .wave-2  { animation-delay: -0.28s; }
      .wave-3  { animation-delay: -0.56s; }
      .wave-4  { animation-delay: -0.84s; }
      .wave-5  { animation-delay: -1.12s; }
      .wave-6  { animation-delay: -1.40s; }
      .wave-7  { animation-delay: -1.68s; }
      .wave-8  { animation-delay: -1.96s; }
      .wave-9  { animation-delay: -2.24s; }
      .wave-10 { animation-delay: -2.52s; }
      .wave-11 { animation-delay: -2.80s; }
      .wave-12 { animation-delay: -3.08s; }
      .wave-13 { animation-delay: -3.36s; }
      .wave-14 { animation-delay: -3.64s; }
      .wave-15 { animation-delay: -3.92s; }
      .wave-16 { animation-delay: -4.20s; }

      @keyframes waveFlow {
        0% {
          transform: translate(0px, 0px);
        }
        25% {
          transform: translate(7px, -3px);
        }
        50% {
          transform: translate(0px, 3.5px);
        }
        75% {
          transform: translate(-7px, -1.5px);
        }
        100% {
          transform: translate(0px, 0px);
        }
      }

      .dot-1 {
        will-change: transform;
        animation: waveFlow 4.6s ease-in-out infinite;
        animation-delay: -2.24s;
      }
      .dot-2 {
        will-change: transform;
        animation: waveFlow 4.6s ease-in-out infinite;
        animation-delay: -1.12s;
      }
      .dot-3 {
        will-change: transform;
        animation: waveFlow 4.6s ease-in-out infinite;
        animation-delay: -3.08s;
      }

      @media (prefers-reduced-motion: reduce) {
        .wave, .dot-1, .dot-2, .dot-3 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g mask="url(#soft-edges)" stroke="url(#topo-stroke)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
    <path class="wave wave-1" d="M8 48C53 37 83 10 119 27C149 42 157 72 192 73C230 74 247 28 282 20C319 12 340 44 394 25"/>
    <path class="wave wave-2" d="M6 65C48 54 82 25 118 42C149 57 158 87 193 88C231 89 249 43 283 35C322 26 345 58 395 40"/>
    <path class="wave wave-3" d="M8 82C52 71 84 42 120 59C149 73 160 102 195 104C233 105 251 60 286 51C324 42 348 73 395 57"/>
    <path class="wave wave-4" d="M10 100C54 87 86 59 122 76C151 90 162 118 197 120C235 121 254 78 288 68C326 58 351 88 397 74"/>
    <path class="wave wave-5" d="M12 118C57 104 88 76 124 93C153 107 165 134 200 136C238 138 256 95 291 85C328 75 354 103 398 91"/>
    <path class="wave wave-6" d="M14 136C59 121 91 93 127 110C156 124 168 151 203 153C241 155 260 113 294 102C331 91 357 119 399 108"/>
    <path class="wave wave-7" d="M15 154C61 138 94 111 130 127C159 140 172 167 207 170C245 172 263 130 297 119C334 107 360 135 400 126"/>
    <path class="wave wave-8" d="M16 173C63 156 97 129 133 145C162 158 175 184 210 187C248 190 267 148 301 137C337 124 363 151 401 144"/>
    <path class="wave wave-9" d="M17 192C65 174 100 148 136 163C165 176 178 202 213 205C251 208 270 167 304 155C340 142 366 168 401 163"/>
    <path class="wave wave-10" d="M18 211C67 192 103 167 139 182C168 194 181 220 216 223C254 227 273 186 307 174C343 160 369 186 402 182"/>
    <path class="wave wave-11" d="M19 230C69 210 106 186 142 201C171 213 184 238 219 242C257 246 277 205 311 193C346 179 372 204 403 201"/>
    <path class="wave wave-12" d="M20 249C71 229 109 205 145 220C174 232 187 257 222 261C260 265 280 225 314 212C349 198 375 223 404 220"/>
    <path class="wave wave-13" d="M21 268C73 247 112 224 148 239C177 251 190 276 225 280C263 284 283 244 317 231C352 217 378 242 405 239"/>
    <path class="wave wave-14" d="M22 287C75 266 115 243 151 258C180 270 193 295 228 299C266 303 286 263 320 250C355 236 381 261 406 258"/>
    <path class="wave wave-15" d="M24 306C78 285 118 262 154 277C183 289 196 314 231 318C269 322 289 282 323 269C358 255 384 280 408 277"/>
    <path class="wave wave-16" d="M27 325C80 304 121 281 157 296C186 308 199 332 234 336C272 340 292 301 326 288C361 274 387 299 410 296"/>
  </g>

  <path d="M405 24V336" stroke="url(#divider)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Somente os 3 pontos originais, sincronizados com as ondas -->
  <g fill="#A8E63A">
    <circle class="dot-1" cx="78" cy="196" r="2.5" opacity="0.85"/>
    <circle class="dot-2" cx="236" cy="118" r="3.2" opacity="0.95"/>
    <circle class="dot-3" cx="326" cy="248" r="2.3" opacity="0.8"/>
  </g>
</svg>
